<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layout Responsivo</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; padding: 16px; background: #f8fafc; }
  .pagina {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  .bloco {
    background: #2563eb;
    color: #fff;
    padding: 24px;
    border-radius: 10px;
    text-align: center;
    font-weight: 800;
  }

  @media (min-width: 600px) {
    .pagina { grid-template-columns: 1fr 1fr; }
  }

  @media (min-width: 1000px) {
    .pagina { grid-template-columns: 1fr 1fr 1fr; }
    .bloco { padding: 36px; }
  }
</style>
</head>
<body>
  <div class="pagina">
    <div class="bloco">Bloco 1</div>
    <div class="bloco">Bloco 2</div>
    <div class="bloco">Bloco 3</div>
    <div class="bloco">Bloco 4</div>
    <div class="bloco">Bloco 5</div>
    <div class="bloco">Bloco 6</div>
  </div>
</body>
</html>
