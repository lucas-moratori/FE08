<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Grid Template Areas</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; padding: 16px; }
  .pagina {
    display: grid;
    gap: 10px;
    grid-template-columns: 180px 1fr;
    grid-template-rows: auto 1fr auto;
    grid-template-areas:
      "cabecalho cabecalho"
      "menu      conteudo"
      "rodape    rodape";
    min-height: 320px;
  }
  .cabecalho { grid-area: cabecalho; background: #1e3a8a; color: #fff; padding: 14px; border-radius: 8px; }
  .menu      { grid-area: menu;      background: #93c5fd; padding: 14px; border-radius: 8px; }
  .conteudo  { grid-area: conteudo;  background: #e0e7ff; padding: 14px; border-radius: 8px; }
  .rodape    { grid-area: rodape;    background: #334155; color: #fff; padding: 14px; border-radius: 8px; }
</style>
</head>
<body>
  <div class="pagina">
    <header class="cabecalho">Cabeçalho</header>
    <nav class="menu">Menu</nav>
    <main class="conteudo">Conteúdo principal</main>
    <footer class="rodape">Rodapé</footer>
  </div>
</body>
</html>
